<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Экспорт старых данных</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
    button:hover { background: #45a049; }
    .status { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>📦 Экспорт данных из старой версии</h1>
  <p>Эта страница экспортирует все данные из IndexedDB без base path.</p>
  <button onclick="exportData()">🚀 Экспортировать данные</button>
  <div id="status" class="status" style="display:none;"></div>

  <script type="module">
    import Dexie from 'https://cdn.jsdelivr.net/npm/dexie@4.0.1/dist/modern/dexie.mjs';

    window.exportData = async function() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      statusEl.className = 'status';
      statusEl.innerHTML = '⏳ Загружаю данные...';

      try {
        // Open database
        const db = new Dexie('detective_board_db');
        db.version(1).stores({ nodes: 'id', links: 'id', users: 'id' });
        db.version(2).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id' });
        db.version(3).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id' });
        db.version(4).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id', purchases: 'id' });
        db.version(5).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id', purchases: 'id', diary: 'id' });
        
        await db.open();

        // Load all data
        const [nodes, links, users, books, movies, games, purchases, diary] = await Promise.all([
          db.table('nodes').toArray(),
          db.table('links').toArray(),
          db.table('users').toArray(),
          db.table('books').toArray(),
          db.table('movies').toArray(),
          db.table('games').toArray(),
          db.table('purchases').toArray(),
          db.table('diary').toArray(),
        ]);

        // Load localStorage
        const localStorageExtra = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key) {
            localStorageExtra[key] = localStorage.getItem(key);
          }
        }

        // Extract gamification data (with zustand persist wrapper fix)
        let gamification = null;
        try {
          const gamifRaw = localStorage.getItem('GAMIFICATION_STATE_V1');
          if (gamifRaw) {
            const parsed = JSON.parse(gamifRaw);
            gamification = parsed.state || parsed; // Extract from zustand persist wrapper
          }
        } catch (e) {
          console.warn('Failed to load gamification:', e);
        }

        // Build backup
        const backup = {
          version: 1,
          exportedAt: new Date().toISOString(),
          nodes,
          links,
          users,
          books,
          movies,
          games,
          purchases,
          diary,
          gamification,
          localStorageExtra: Object.keys(localStorageExtra).length > 0 ? localStorageExtra : undefined,
        };

        // Download
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `detective-board-backup-${new Date().toISOString()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusEl.className = 'status success';
        statusEl.innerHTML = `✅ Успешно экспортировано!<br><br>
          📊 Статистика:<br>
          • Задачи: ${nodes.length}<br>
          • Дневник: ${diary.length} записей<br>
          • Уровень: ${gamification?.level || 1}<br>
          • XP: ${gamification?.xp || 0}<br>
          • Достижения: ${gamification?.achievements?.length || 0}<br>
          • Картинки: ${Object.keys(localStorageExtra).filter(k => k.startsWith('img:')).length}<br><br>
          <strong>Теперь откройте https://ibet.team/detective-board/ и импортируйте файл!</strong>`;
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.innerHTML = `❌ Ошибка: ${error.message}<br><br>Подробности в консоли (F12)`;
        console.error('Export error:', error);
      }
    };
  </script>
</body>
</html>
