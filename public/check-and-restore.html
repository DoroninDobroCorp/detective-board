<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Проверка localStorage</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; margin: 10px 5px; }
    .status { margin-top: 20px; padding: 20px; background: white; border-radius: 8px; }
    .good { color: #4CAF50; font-weight: bold; }
    .bad { color: #f44336; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔍 Проверка и восстановление</h1>
  <p><strong>Текущий URL:</strong> <span id="url"></span></p>
  
  <button onclick="checkNow()">🔎 Проверить localStorage</button>
  
  <div id="status" class="status" style="display:none;"></div>

  <script>
    document.getElementById('url').textContent = window.location.href;

    window.checkNow = function() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';

      let html = '<h2>📊 Данные localStorage:</h2>';

      // Check gamification
      const gamifRaw = localStorage.getItem('GAMIFICATION_STATE_V1');
      if (gamifRaw) {
        try {
          const parsed = JSON.parse(gamifRaw);
          const gamif = parsed.state || parsed;
          
          html += `<h3 class="${gamif.level > 1 ? 'good' : 'bad'}">Уровень: ${gamif.level || 1}</h3>`;
          html += `<p><strong>XP:</strong> ${gamif.xp || 0}</p>`;
          html += `<p><strong>Достижения:</strong> ${gamif.achievements?.length || 0}</p>`;
          html += `<p><strong>XP история:</strong> ${gamif.xpHistory?.length || 0} записей</p>`;
          html += `<p><strong>Выполнено задач:</strong> ${gamif.completions?.length || 0}</p>`;

          if (gamif.level > 1) {
            html += '<h3 class="good">✅ Данные на месте!</h3>';
            html += '<p>Просто перезагрузи страницу: <a href="/detective-board/">https://ibet.team/detective-board/</a></p>';
          } else {
            html += '<h3 class="bad">❌ Уровень потерян</h3>';
            html += '<p>Нужно восстановить через <a href="/detective-board/rebuild-gamification.html">rebuild-gamification.html</a></p>';
          }

          html += '<br><h3>Полные данные:</h3>';
          html += '<pre style="font-size: 11px; overflow: auto; max-height: 300px;">';
          html += JSON.stringify(gamif, null, 2);
          html += '</pre>';

        } catch (e) {
          html += '<p class="bad">Ошибка парсинга: ' + e.message + '</p>';
        }
      } else {
        html += '<p class="bad">❌ GAMIFICATION_STATE_V1 не найден в localStorage!</p>';
        html += '<p>Возможно ты на другом URL. Попробуй:</p>';
        html += '<ul>';
        html += '<li><a href="http://145.239.82.124:5173/detective-board/check-and-restore.html">http://145.239.82.124:5173/detective-board/check-and-restore.html</a></li>';
        html += '<li><a href="https://ibet.team/detective-board/check-and-restore.html">https://ibet.team/detective-board/check-and-restore.html</a></li>';
        html += '</ul>';
      }

      // Show all localStorage keys
      html += '<br><h3>Все ключи localStorage:</h3><ul style="font-size: 12px;">';
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key) {
          const val = localStorage.getItem(key);
          const size = val ? (val.length / 1024).toFixed(1) : '0';
          html += `<li><strong>${key}:</strong> ${size} KB</li>`;
        }
      }
      html += '</ul>';

      statusEl.innerHTML = html;
    };

    // Auto-check on load
    setTimeout(() => window.checkNow(), 500);
  </script>
</body>
</html>
