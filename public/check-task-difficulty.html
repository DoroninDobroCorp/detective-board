<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Проверка сложности задач</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    pre { background: #000; padding: 15px; border-radius: 5px; overflow: auto; max-height: 600px; border: 1px solid #0f0; }
    button { padding: 10px 20px; font-size: 16px; background: #0f0; color: #000; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔍 Проверка сложности задач в IndexedDB</h1>
  <button onclick="checkDifficulty()">Проверить</button>
  <div id="output"></div>

  <script>
    function checkDifficulty() {
      const output = document.getElementById('output');
      output.innerHTML = '<p>Загрузка...</p>';

      // First, list all databases
      indexedDB.databases().then(dbs => {
        let html = '<h2>Найденные базы данных:</h2><pre>';
        dbs.forEach(db => {
          html += `${db.name} (version ${db.version})\n`;
        });
        html += '</pre>';
        output.innerHTML = html;
        
        // Try to open the right one
        const taskDb = dbs.find(d => d.name && (d.name.includes('task') || d.name.includes('board') || d.name.includes('detective')));
        if (!taskDb) {
          output.innerHTML += '<p style="color: red;">База с задачами не найдена!</p>';
          return;
        }
        
        output.innerHTML += `<p>Открываю ${taskDb.name}...</p>`;
        
        const req = indexedDB.open(taskDb.name);
        
        req.onerror = () => {
          output.innerHTML += '<p style="color: red;">Ошибка открытия IndexedDB</p>';
        };

        req.onsuccess = (e) => {
          const db = e.target.result;
          const storeNames = Array.from(db.objectStoreNames);
          
          output.innerHTML += `<h2>Таблицы в ${taskDb.name}:</h2><pre>${storeNames.join('\n')}</pre>`;
          
          if (storeNames.length === 0) {
            output.innerHTML += '<p style="color: red;">Нет таблиц!</p>';
            return;
          }
          
          // Find the tasks table
          const tasksStore = storeNames.find(s => s.includes('node') || s.includes('task'));
          if (!tasksStore) {
            output.innerHTML += '<p style="color: red;">Таблица с задачами не найдена!</p>';
            return;
          }
          
          const tx = db.transaction([tasksStore], 'readonly');
          const store = tx.objectStore(tasksStore);
          const allReq = store.getAll();

        allReq.onsuccess = () => {
          const nodes = allReq.result;
          const completed = nodes.filter(n => n.type === 'task' && n.completed);
          
          let html = '<h2>Завершённые задачи (' + completed.length + '):</h2>';
          html += '<pre>';
          
          completed.forEach((task, i) => {
            html += `\n===== Задача ${i + 1} =====\n`;
            html += `ID: ${task.id}\n`;
            html += `Название: ${task.title}\n`;
            html += `Completed: ${task.completed}\n`;
            html += `CompletedAt: ${task.completedAt ? new Date(task.completedAt).toLocaleString() : 'не указано'}\n`;
            html += `UpdatedAt: ${task.updatedAt ? new Date(task.updatedAt).toLocaleString() : 'не указано'}\n`;
            
            // Check for difficulty-related fields
            const keys = Object.keys(task);
            html += `Все поля: ${keys.join(', ')}\n`;
            
            // Check if there's difficulty info
            if (task.difficulty) html += `⚠️ DIFFICULTY: ${task.difficulty}\n`;
            if (task.xp) html += `⚠️ XP: ${task.xp}\n`;
            if (task.points) html += `⚠️ POINTS: ${task.points}\n`;
            if (task.complexity) html += `⚠️ COMPLEXITY: ${task.complexity}\n`;
            if (task.effort) html += `⚠️ EFFORT: ${task.effort}\n`;
            if (task.priority) html += `Priority: ${task.priority}\n`;
            
            // Show metadata
            if (task.metadata) {
              html += `Metadata: ${JSON.stringify(task.metadata, null, 2)}\n`;
            }
            
            // Check description length as proxy for complexity
            const descLength = (task.description || '').length;
            html += `Длина описания: ${descLength} символов\n`;
          });
          
          html += '</pre>';
          
          // Summary
          html += '<h2>Выводы:</h2>';
          const hasDifficulty = completed.some(t => t.difficulty || t.xp || t.points || t.complexity || t.effort);
          if (hasDifficulty) {
            html += '<p style="color: #0f0;">✅ Найдена информация о сложности! Можно восстановить!</p>';
          } else {
            html += '<p style="color: #ff0;">⚠️ Информации о сложности в IndexedDB нет. ';
            html += 'Можно попробовать эвристику (длина описания, кол-во подзадач и т.д.)</p>';
          }
          
          output.innerHTML = html;
        };
        
        req.onerror = (err) => {
          output.innerHTML += '<p style="color: red;">Ошибка: ' + err + '</p>';
        };
      }).catch(err => {
        output.innerHTML += '<p style="color: red;">Ошибка получения списка баз: ' + err + '</p>';
      });
    }
  </script>
</body>
</html>
