<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Копирование на домен</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 40px; }
    h1 { margin-top: 0; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: white; color: #667eea; border: none; border-radius: 8px; font-weight: 600; margin: 10px 5px; }
    button:hover { background: #f0f0f0; }
    .status { margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.2); border-radius: 8px; }
    .good { color: #4ade80; }
    .bad { color: #f87171; }
    pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px; overflow: auto; max-height: 300px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Копирование данных между доменами</h1>
    <p><strong>Текущий URL:</strong> <span id="url"></span></p>
    
    <h2>Шаг 1: Экспортировать отсюда</h2>
    <button onclick="exportData()">📤 Экспортировать localStorage</button>
    
    <h2>Шаг 2: Скопировать данные</h2>
    <textarea id="dataBox" style="width: 100%; height: 150px; font-family: monospace; padding: 10px;" placeholder="Данные появятся здесь..."></textarea>
    
    <h2>Шаг 3: Импортировать на другом домене</h2>
    <button onclick="importData()">📥 Импортировать localStorage</button>
    
    <div id="status" class="status" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('url').textContent = window.location.href;

    window.exportData = function() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      
      try {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key) {
            data[key] = localStorage.getItem(key);
          }
        }
        
        const json = JSON.stringify(data);
        document.getElementById('dataBox').value = json;
        
        statusEl.innerHTML = '<h3 class="good">✅ Экспортировано!</h3>';
        statusEl.innerHTML += `<p>${Object.keys(data).length} ключей, ${(json.length / 1024).toFixed(2)} KB</p>`;
        statusEl.innerHTML += '<p><strong>Теперь:</strong></p>';
        statusEl.innerHTML += '<ol><li>Скопируй весь текст из поля выше (Ctrl+A, Ctrl+C)</li>';
        statusEl.innerHTML += '<li>Открой <strong>https://ibet.team/detective-board/copy-to-domain.html</strong></li>';
        statusEl.innerHTML += '<li>Вставь текст в поле (Ctrl+V)</li>';
        statusEl.innerHTML += '<li>Нажми "📥 Импортировать"</li></ol>';
        
      } catch (e) {
        statusEl.innerHTML = '<h3 class="bad">❌ Ошибка: ' + e.message + '</h3>';
      }
    };

    window.importData = function() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      
      try {
        const json = document.getElementById('dataBox').value;
        if (!json) {
          throw new Error('Вставь данные в поле выше!');
        }
        
        const data = JSON.parse(json);
        let imported = 0;
        
        for (const [key, value] of Object.entries(data)) {
          localStorage.setItem(key, value);
          imported++;
        }
        
        statusEl.innerHTML = '<h3 class="good">✅ Импортировано!</h3>';
        statusEl.innerHTML += `<p>${imported} ключей успешно скопированы в localStorage</p>`;
        statusEl.innerHTML += '<p><strong>Теперь перезагрузи страницу:</strong></p>';
        statusEl.innerHTML += '<a href="/detective-board/" style="display: inline-block; padding: 10px 20px; background: white; color: #667eea; text-decoration: none; border-radius: 5px; margin-top: 10px;">Открыть Detective Board</a>';
        
        // Show what was imported
        const gamif = localStorage.getItem('GAMIFICATION_STATE_V1');
        if (gamif) {
          try {
            const parsed = JSON.parse(gamif);
            const state = parsed.state || parsed;
            statusEl.innerHTML += '<br><br><strong>Геймификация:</strong>';
            statusEl.innerHTML += `<p>Уровень: <span class="good">${state.level || 1}</span>, XP: <span class="good">${state.xp || 0}</span></p>`;
          } catch (e) {}
        }
        
      } catch (e) {
        statusEl.innerHTML = '<h3 class="bad">❌ Ошибка: ' + e.message + '</h3>';
      }
    };
  </script>
</body>
</html>
