<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Восстановление геймификации</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 50px auto; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: white; color: #667eea; border: none; border-radius: 8px; font-weight: 600; margin: 10px 5px; }
    button:hover { background: #f0f0f0; }
    .status { margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.2); border-radius: 8px; font-size: 14px; max-height: 400px; overflow-y: auto; }
    .good { color: #4ade80; font-weight: bold; }
    .warning { color: #fbbf24; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Восстановление геймификации</h1>
    <p>Этот скрипт пересчитает твой уровень и XP на основе завершённых задач из IndexedDB!</p>
    
    <button onclick="analyzeAndRebuild()">🚀 Пересчитать уровни</button>
    
    <div id="status" class="status" style="display:none;"></div>
  </div>

  <script type="module">
    import Dexie from 'https://cdn.jsdelivr.net/npm/dexie@4.0.1/dist/modern/dexie.mjs';

    // Fallback UUID generator
    function generateUUID() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Fallback for older browsers or HTTP
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    window.analyzeAndRebuild = async function() {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      statusEl.innerHTML = '⏳ Анализирую IndexedDB...';

      try {
        // Open database
        const db = new Dexie('detective_board_db');
        db.version(1).stores({ nodes: 'id', links: 'id', users: 'id' });
        db.version(2).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id' });
        db.version(3).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id' });
        db.version(4).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id', purchases: 'id' });
        db.version(5).stores({ nodes: 'id', links: 'id', users: 'id', books: 'id', movies: 'id', games: 'id', purchases: 'id', diary: 'id' });
        
        await db.open();

        // Get all data
        const [nodes, books, movies, games, purchases, diary] = await Promise.all([
          db.table('nodes').toArray(),
          db.table('books').toArray(),
          db.table('movies').toArray(),
          db.table('games').toArray(),
          db.table('purchases').toArray(),
          db.table('diary').toArray(),
        ]);

        statusEl.innerHTML += '<br>✅ База загружена: ' + nodes.length + ' задач';

        // Find completed tasks
        const completedTasks = nodes.filter(n => n.type === 'task' && n.status === 'done');
        const completedBooks = books.filter(b => b.status === 'done');
        const completedMovies = movies.filter(m => m.status === 'done');
        const completedGames = games.filter(g => g.status === 'done');
        const completedPurchases = purchases.filter(p => p.status === 'done');

        statusEl.innerHTML += '<br><br><h3>📊 Найдено выполненных:</h3>';
        statusEl.innerHTML += `• Задачи: <span class="good">${completedTasks.length}</span><br>`;
        statusEl.innerHTML += `• Книги: <span class="good">${completedBooks.length}</span><br>`;
        statusEl.innerHTML += `• Фильмы: <span class="good">${completedMovies.length}</span><br>`;
        statusEl.innerHTML += `• Игры: <span class="good">${completedGames.length}</span><br>`;
        statusEl.innerHTML += `• Покупки: <span class="good">${completedPurchases.length}</span><br>`;
        statusEl.innerHTML += `• Записей дневника: <span class="good">${diary.length}</span><br>`;

        // Calculate XP
        // Sort tasks by completion time to calculate accumulated XP correctly
        const allTasks = [
          ...completedTasks.map(t => ({ 
            ...t, 
            type: 'task', 
            sortTime: t.completedAt || t.updatedAt || Date.now() 
          })),
          ...completedBooks.map(b => ({ 
            ...b, 
            type: 'book', 
            sortTime: b.completedAt || b.createdAt || Date.now() 
          })),
          ...completedMovies.map(m => ({ 
            ...m, 
            type: 'movie', 
            sortTime: m.completedAt || m.createdAt || Date.now() 
          })),
          ...completedGames.map(g => ({ 
            ...g, 
            type: 'game', 
            sortTime: g.completedAt || g.createdAt || Date.now() 
          })),
          ...completedPurchases.map(p => ({ 
            ...p, 
            type: 'purchase', 
            sortTime: p.completedAt || p.createdAt || Date.now() 
          })),
        ].sort((a, b) => a.sortTime - b.sortTime);

        let totalXP = 0;
        const xpHistory = [];
        const completions = [];
        const processedTasks = {};

        // Process tasks in chronological order
        for (const item of allTasks) {
          const isTask = item.type === 'task';
          const baseXP = isTask ? 100 : 50;
          const currentTs = item.sortTime;
          
          totalXP += baseXP;
          
          if (isTask) {
            processedTasks[item.id] = true;
            
            xpHistory.push({
              id: generateUUID(),
              amount: baseXP,
              source: 'task',
              note: item.title || 'Задача',
              taskId: item.id,
              ts: currentTs,
            });

            completions.push({
              id: item.id,
              title: item.title || 'Задача',
              completedAt: currentTs,
              difficulty: 'medium',
              xp: baseXP,
              parentPath: [],
              iconEmoji: item.iconEmoji,
            });
          } else {
            const completionId = `${item.type}:${item.id}:${currentTs}`;
            processedTasks[completionId] = true;
            
            xpHistory.push({
              id: generateUUID(),
              amount: baseXP,
              source: 'task',
              note: item.title,
              ts: currentTs,
            });
          }
        }

        // Calculate level - MUST match gamification.ts logic EXACTLY!
        function xpRequiredForNext(level) {
          const base = 250;
          const scale = 1.12;
          const core = base * Math.pow(Math.max(level, 1), 1.35) + 180;
          return Math.max(150, Math.round(core * scale));
        }

        function totalXpForLevel(level) {
          if (level <= 1) return 0;
          let total = 0;
          for (let i = 1; i < level; i++) {
            total += xpRequiredForNext(i);
          }
          return total;
        }
        
        function levelForXp(xp) {
          let level = 1;
          while (xp >= totalXpForLevel(level + 1)) {
            level++;
            if (level > 999) break;
          }
          return level;
        }

        const level = levelForXp(totalXP);

        statusEl.innerHTML += '<br><br><h3 class="good">🎉 ПЕРЕСЧИТАНО!</h3>';
        statusEl.innerHTML += `<div style="font-size: 20px;">`;
        statusEl.innerHTML += `<strong>Уровень:</strong> <span class="good">${level}</span><br>`;
        statusEl.innerHTML += `<strong>XP:</strong> <span class="good">${totalXP}</span><br>`;
        statusEl.innerHTML += `<strong>Выполнено всего:</strong> ${allTasks.length}<br>`;
        statusEl.innerHTML += `</div>`;

        // Build gamification state
        const gamificationState = {
          xp: totalXP,
          level: level,
          xpHistory: xpHistory,
          completions: completions,
          processedTasks: processedTasks,
          achievements: [],
          levelTitles: {
            1: { title: 'Новичок', assignedAt: Date.now() - 1000000 },
          },
          claimedBonuses: {},
          pendingLevelUps: [],
          pendingManualCandidates: [],
        };

        // Add level titles based on current level
        const levelNames = [
          'Новичок', 'Исследователь', 'Практик', 'Специалист', 'Эксперт',
          'Мастер', 'Виртуоз', 'Гуру', 'Легенда', 'Титан'
        ];
        for (let i = 1; i <= level; i++) {
          gamificationState.levelTitles[i] = {
            title: levelNames[Math.min(i - 1, levelNames.length - 1)],
            assignedAt: Date.now() - (level - i) * 86400000, // Spread over days
          };
        }

        statusEl.innerHTML += '<br><br>💾 Сохраняю в localStorage...';

        // Save to localStorage with zustand persist wrapper
        const zustandFormat = {
          state: gamificationState,
          version: 0,
        };
        localStorage.setItem('GAMIFICATION_STATE_V1', JSON.stringify(zustandFormat));

        statusEl.innerHTML += '<br>✅ Сохранено!';
        statusEl.innerHTML += '<br><br><h3 class="good">🎊 ГОТОВО!</h3>';
        statusEl.innerHTML += '<p>Твои уровни восстановлены! Перезагружаю страницу...</p>';

        setTimeout(() => {
          window.location.href = '/detective-board/';
        }, 3000);

      } catch (error) {
        statusEl.innerHTML = '<h3 style="color: #f87171;">❌ Ошибка:</h3><pre>' + error.message + '\n\n' + error.stack + '</pre>';
        console.error('Rebuild error:', error);
      }
    };
  </script>
</body>
</html>
