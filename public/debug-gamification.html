<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Debug геймификации</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    h1 { color: #0ff; }
    h2 { color: #ff0; margin-top: 30px; }
    pre { background: #000; padding: 15px; border-radius: 5px; overflow: auto; max-height: 400px; border: 1px solid #0f0; }
    .good { color: #0f0; }
    .bad { color: #f00; }
    .warn { color: #ff0; }
    table { border-collapse: collapse; margin: 10px 0; }
    td, th { border: 1px solid #0f0; padding: 8px; text-align: left; }
    th { background: #333; }
  </style>
</head>
<body>
  <h1>🔍 Debug геймификации</h1>
  <p>URL: <span id="url"></span></p>
  <button onclick="analyze()" style="padding: 10px 20px; font-size: 16px;">🔬 Анализировать</button>
  <div id="output"></div>

  <script>
    document.getElementById('url').textContent = window.location.href;

    function xpRequiredForNext(level) {
      const base = 250;
      const scale = 1.12;
      const core = base * Math.pow(Math.max(level, 1), 1.35) + 180;
      return Math.max(150, Math.round(core * scale));
    }

    function totalXpForLevel(level) {
      if (level <= 1) return 0;
      let total = 0;
      for (let i = 1; i < level; i++) {
        total += xpRequiredForNext(i);
      }
      return total;
    }

    function levelForXp(xp) {
      let level = 1;
      while (xp >= totalXpForLevel(level + 1)) {
        level++;
        if (level > 999) break;
      }
      return level;
    }

    window.analyze = function() {
      const output = document.getElementById('output');
      let html = '';

      // Load gamification state
      const raw = localStorage.getItem('GAMIFICATION_STATE_V1');
      if (!raw) {
        html += '<h2 class="bad">❌ GAMIFICATION_STATE_V1 not found!</h2>';
        output.innerHTML = html;
        return;
      }

      let gamif;
      try {
        const parsed = JSON.parse(raw);
        gamif = parsed.state || parsed;
      } catch (e) {
        html += '<h2 class="bad">❌ Parse error: ' + e.message + '</h2>';
        output.innerHTML = html;
        return;
      }

      // Basic info
      html += '<h2>📊 Basic Info</h2>';
      html += `<p><strong>Current XP:</strong> <span class="good">${gamif.xp || 0}</span></p>`;
      html += `<p><strong>Current Level:</strong> <span class="good">${gamif.level || 1}</span></p>`;
      html += `<p><strong>Calculated Level from XP:</strong> <span class="${levelForXp(gamif.xp) === gamif.level ? 'good' : 'bad'}">${levelForXp(gamif.xp)}</span></p>`;
      
      const progress = gamif.xp - totalXpForLevel(gamif.level);
      const required = totalXpForLevel(gamif.level + 1) - totalXpForLevel(gamif.level);
      html += `<p><strong>Progress in level:</strong> <span class="good">${progress}</span> / ${required}</p>`;

      // Level thresholds
      html += '<h2>🎯 Level Thresholds</h2>';
      html += '<table><tr><th>Level</th><th>Total XP Required</th><th>XP for this level</th></tr>';
      for (let i = 1; i <= Math.min(gamif.level + 2, 15); i++) {
        const threshold = totalXpForLevel(i);
        const nextThreshold = totalXpForLevel(i + 1);
        const range = nextThreshold - threshold;
        const isCurrent = i === gamif.level;
        html += `<tr style="background: ${isCurrent ? '#003300' : 'transparent'}">`;
        html += `<td>${i}${isCurrent ? ' ⬅️' : ''}</td>`;
        html += `<td>${threshold}</td>`;
        html += `<td>${range}</td>`;
        html += '</tr>';
      }
      html += '</table>';

      // XP History
      html += '<h2>📜 XP History (first 10)</h2>';
      if (gamif.xpHistory && gamif.xpHistory.length > 0) {
        html += `<p>Total entries: ${gamif.xpHistory.length}</p>`;
        html += '<table><tr><th>#</th><th>Amount</th><th>Note</th><th>Timestamp</th><th>Accumulated</th><th>Level at time</th></tr>';
        
        const sorted = [...gamif.xpHistory].sort((a, b) => a.ts - b.ts);
        let acc = 0;
        for (let i = 0; i < Math.min(10, sorted.length); i++) {
          const entry = sorted[i];
          acc += entry.amount;
          const lvl = levelForXp(acc);
          html += '<tr>';
          html += `<td>${i + 1}</td>`;
          html += `<td class="good">+${entry.amount}</td>`;
          html += `<td>${entry.note || '-'}</td>`;
          html += `<td>${new Date(entry.ts).toLocaleString()}</td>`;
          html += `<td>${acc}</td>`;
          html += `<td>${lvl}</td>`;
          html += '</tr>';
        }
        html += '</table>';
      } else {
        html += '<p class="bad">No XP history!</p>';
      }

      // Completions
      html += '<h2>✅ Completions (first 10)</h2>';
      if (gamif.completions && gamif.completions.length > 0) {
        html += `<p>Total: ${gamif.completions.length}</p>`;
        html += '<table><tr><th>#</th><th>Title</th><th>XP</th><th>Completed At</th></tr>';
        
        for (let i = 0; i < Math.min(10, gamif.completions.length); i++) {
          const c = gamif.completions[i];
          html += '<tr>';
          html += `<td>${i + 1}</td>`;
          html += `<td>${c.title}</td>`;
          html += `<td class="good">+${c.xp}</td>`;
          html += `<td>${new Date(c.completedAt).toLocaleString()}</td>`;
          html += '</tr>';
        }
        html += '</table>';
      } else {
        html += '<p class="bad">No completions!</p>';
      }

      // Level distribution
      html += '<h2>📊 Task Distribution by Level</h2>';
      if (gamif.completions && gamif.xpHistory) {
        const sorted = [...gamif.xpHistory].sort((a, b) => a.ts - b.ts);
        const tasksByLevel = {};
        
        gamif.completions.forEach(c => {
          let acc = 0;
          for (const entry of sorted) {
            if (entry.ts <= c.completedAt) {
              acc += entry.amount;
            }
          }
          const lvl = levelForXp(acc);
          if (!tasksByLevel[lvl]) tasksByLevel[lvl] = [];
          tasksByLevel[lvl].push({ ...c, accXp: acc });
        });

        html += '<table><tr><th>Level</th><th>Tasks</th><th>Task List</th></tr>';
        for (let lvl = 1; lvl <= Math.max(...Object.keys(tasksByLevel).map(Number)); lvl++) {
          const tasks = tasksByLevel[lvl] || [];
          html += '<tr>';
          html += `<td>${lvl}</td>`;
          html += `<td class="${tasks.length > 0 ? 'good' : 'warn'}">${tasks.length}</td>`;
          html += '<td><ul style="margin: 0; padding-left: 20px;">';
          tasks.forEach(t => {
            html += `<li>${t.title} (${t.accXp} XP)</li>`;
          });
          html += '</ul></td>';
          html += '</tr>';
        }
        html += '</table>';
      }

      // Raw data
      html += '<h2>🗂️ Raw Data</h2>';
      html += '<pre>' + JSON.stringify(gamif, null, 2).substring(0, 5000) + '</pre>';

      output.innerHTML = html;
    };

    // Auto-run
    setTimeout(() => window.analyze(), 500);
  </script>
</body>
</html>
