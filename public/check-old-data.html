<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Проверка старых данных</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #0f0; }
    button { padding: 15px 30px; background: #0f0; color: #000; border: none; cursor: pointer; }
    pre { background: #000; padding: 15px; border-radius: 5px; overflow: auto; max-height: 500px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>🔍 Проверка старых данных в localStorage</h1>
  <p><strong>Текущий URL:</strong> <span id="url"></span></p>
  
  <button onclick="check()">Проверить все версии localStorage</button>
  
  <div id="output"></div>

  <script>
    document.getElementById('url').textContent = window.location.href;

    function check() {
      const output = document.getElementById('output');
      let html = '<h2>Все ключи в localStorage:</h2>';
      
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        keys.push(localStorage.key(i));
      }
      
      html += `<p>Найдено ключей: ${keys.length}</p>`;
      html += '<ul>';
      keys.forEach(k => html += `<li>${k}</li>`);
      html += '</ul>';
      
      // Check all gamification-related keys
      const gamifKeys = keys.filter(k => k.includes('GAMIF') || k.includes('gamif') || k.includes('xp') || k.includes('level'));
      
      if (gamifKeys.length === 0) {
        html += '<p style="color: red;">❌ Нет данных геймификации</p>';
        output.innerHTML = html;
        return;
      }
      
      html += '<h2>Данные геймификации:</h2>';
      
      gamifKeys.forEach(key => {
        html += `<h3>${key}</h3>`;
        try {
          const raw = localStorage.getItem(key);
          const parsed = JSON.parse(raw);
          const state = parsed.state || parsed;
          
          if (state.level || state.xp) {
            html += `<p><strong>Уровень:</strong> ${state.level || '?'}</p>`;
            html += `<p><strong>XP:</strong> ${state.xp || 0}</p>`;
            html += `<p><strong>Completions:</strong> ${state.completions?.length || 0}</p>`;
            
            if (state.completions && state.completions.length > 0) {
              html += '<h4>Первые 5 задач с XP:</h4><ul>';
              state.completions.slice(0, 5).forEach(c => {
                html += `<li>${c.title}: <strong>${c.xp || '?'} XP</strong> (difficulty: ${c.difficulty || '?'})</li>`;
              });
              html += '</ul>';
              
              // Check if XP varies
              const xps = state.completions.map(c => c.xp).filter(x => x);
              const uniqueXps = [...new Set(xps)];
              if (uniqueXps.length > 1) {
                html += `<p style="color: #0f0;">✅ Найдены задачи с разными XP: ${uniqueXps.join(', ')}</p>`;
                html += '<p><strong>МОЖНО ВОССТАНОВИТЬ!</strong></p>';
              } else if (uniqueXps.length === 1) {
                html += `<p style="color: #ff0;">⚠️ Все задачи с одинаковым XP: ${uniqueXps[0]}</p>`;
              }
            }
            
            html += '<details><summary>Полные данные</summary><pre>';
            html += JSON.stringify(state, null, 2).substring(0, 10000);
            html += '</pre></details>';
          }
        } catch (e) {
          html += `<p style="color: red;">Ошибка парсинга: ${e.message}</p>`;
        }
      });
      
      output.innerHTML = html;
    }
    
    setTimeout(() => check(), 500);
  </script>
</body>
</html>
